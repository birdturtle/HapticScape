name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and verify standalone
    runs-on: ubuntu-latest

    steps:
      - name: Check out HapticScape
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test remote relay
        working-directory: remote-relay
        run: npm test

      - name: Run compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            clean \
            test \
            verifyStandaloneArtifact \
            collectRuntimeLicenses \
            :runelite-bridge-client:test \
            :runelite-bridge-client:verifyBridgeClientJar \
            :runelite-bridge-client:collectRuntimeLicenses

      - name: Upload standalone desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: hapticscape-desktop-${{ github.sha }}
          path: build/libs/hapticscape-desktop.jar
          retention-days: 14


      - name: Upload LumBridge JAR
        uses: actions/upload-artifact@v4
        with:
          name: lumbridge-${{ github.sha }}
          path: runelite-bridge-client/build/libs/lumbridge.jar
          retention-days: 14

  package-windows:
    name: Package Windows bundles
    runs-on: windows-latest

    steps:
      - name: Check out HapticScape
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node for the launcher
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust for the launcher
        run: rustup update stable

      - name: Build both release ZIPs
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = '0.0.0-ci'
          if ($env:RELEASE_REF_TYPE -eq 'tag') {
            if ($env:RELEASE_REF_NAME -notmatch '^v([0-9]+(?:\.[0-9]+){2,3}(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?)$') {
              throw "Expected a version tag such as v3.1.4, got $env:RELEASE_REF_NAME"
            }
            $version = $Matches[1]
          }
          .\package-all.ps1 -Version $version -UnifiedLauncher

      - name: Upload Windows package candidates
        uses: actions/upload-artifact@v4
        with:
          name: hapticscape-windows-packages-${{ github.sha }}
          path: build/distribution/*.zip*
          retention-days: 7
