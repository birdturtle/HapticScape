plugins {
	id 'java'
}

repositories {
	mavenLocal()
	mavenCentral()
}

def desktopMainClass = 'com.ashy0019.hapticscape.desktop.HapticScapeDesktopMain'
def appVersion = providers.gradleProperty('appVersion').orElse('development')
version = appVersion.get()
// Keep the packaged desktop runtime dependency set explicit.
// verifyStandaloneDependencies fails if the runtime graph grows unexpectedly.
def standaloneRuntimeModules = [
	'ch.qos.logback:logback-classic',
	'ch.qos.logback:logback-core',
	'com.formdev:flatlaf',
	'com.google.code.gson:gson',
	'com.squareup.okhttp3:okhttp',
	'com.squareup.okio:okio',
	'net.java.dev.jna:jna',
	'net.java.dev.jna:jna-platform',
	'org.slf4j:slf4j-api'
] as Set

dependencies {
	implementation 'com.formdev:flatlaf:3.7.2'
	implementation 'com.google.code.gson:gson:2.8.5'
	implementation 'com.squareup.okhttp3:okhttp:3.14.9'
	implementation 'net.java.dev.jna:jna:5.9.0'
	implementation 'net.java.dev.jna:jna-platform:5.9.0'
	implementation 'org.slf4j:slf4j-api:1.7.32'
	runtimeOnly 'ch.qos.logback:logback-classic:1.2.9'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
}

def standaloneRuntimeArtifacts = {
	configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
		def module = "${artifact.moduleVersion.id.group}:${artifact.name}".toString()
		standaloneRuntimeModules.contains(module)
	}
}

def standaloneRuntimeFiles = {
	standaloneRuntimeArtifacts().collect { it.file }
}

group = 'com.ashy0019'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('processResources') {
	filesMatching('hapticscape-version.properties') {
		expand(appVersion: appVersion.get())
	}
}

tasks.register('standaloneJar', Jar) {
	dependsOn tasks.named('classes')
	dependsOn configurations.runtimeClasspath
	manifest {
		attributes(
			'Main-Class': desktopMainClass,
			'Multi-Release': true,
			'Implementation-Title': 'HapticScape Desktop',
			'Implementation-Version': appVersion.get()
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.main.output)
	from {
		standaloneRuntimeFiles().collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('desktop')
	archiveFileName.set('hapticscape-desktop.jar')
}

tasks.register('runStandalone', JavaExec) {
	dependsOn tasks.named('standaloneJar')
	classpath = files(tasks.named('standaloneJar').flatMap { it.archiveFile })
	mainClass = desktopMainClass
	jvmArgs "-ea"
}

tasks.register('verifySourceIndependence') {
	def forbiddenHostTerms = ['rune' + 'lite']
	def productionJavaSources = fileTree('src/main/java') {
		include '**/*.java'
	}
	inputs.files(productionJavaSources)

	doLast {
		def violations = []
		productionJavaSources.files.sort { left, right ->
			project.relativePath(left) <=> project.relativePath(right)
		}.each { sourceFile ->
			def relativePath = project.relativePath(sourceFile).replace('\\', '/')
			sourceFile.eachLine('UTF-8') { line, lineNumber ->
				def normalized = line.toLowerCase(java.util.Locale.ROOT)
				if (forbiddenHostTerms.any { normalized.contains(it) }) {
					violations.add("${relativePath}:${lineNumber}: ${line.trim()}")
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException(
				'Host-specific terminology leaked into the standalone production source:\n  '
					+ violations.join('\n  ')
			)
		}
	}
}

tasks.register('verifyStandaloneDependencies') {
	dependsOn configurations.runtimeClasspath

	doLast {
		def runtimeArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
		def runtimeModules = runtimeArtifacts.collect { artifact ->
			"${artifact.moduleVersion.id.group}:${artifact.name}".toString()
		}.toSet()
		def unexpectedModules = runtimeModules.findAll { !standaloneRuntimeModules.contains(it) }

		if (!unexpectedModules.isEmpty()) {
			throw new GradleException(
				"Standalone runtime contains unreviewed dependencies: ${unexpectedModules.sort().join(', ')}"
			)
		}
	}
}

tasks.register('verifyStandaloneJar') {
	dependsOn tasks.named('standaloneJar')
	dependsOn tasks.named('verifyStandaloneDependencies')

	doLast {
		def jarFile = tasks.named('standaloneJar').get().archiveFile.get().asFile
		def hasLauncher = false
		def hasVersionResource = false
		def forbiddenEntries = []

		zipTree(jarFile).visit { details ->
			if (details.directory) {
				return
			}

			def path = details.relativePath.pathString
			if (path == 'com/ashy0019/hapticscape/desktop/HapticScapeDesktopMain.class') {
				hasLauncher = true
			}
			if (path == 'hapticscape-version.properties') {
				hasVersionResource = true
			}
			if (path.startsWith('org/junit/')
				|| path.startsWith('org/hamcrest/')
				|| (path.startsWith('com/ashy0019/hapticscape/') && path.endsWith('Test.class'))) {
				forbiddenEntries.add(path)
			}
		}

		if (!hasLauncher) {
			throw new GradleException('The standalone desktop launcher class is missing.')
		}
		if (!hasVersionResource) {
			throw new GradleException('The standalone version metadata is missing.')
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException(
				"Test code leaked into the standalone JAR: ${forbiddenEntries.sort().join(', ')}"
			)
		}
	}
}

tasks.register('verifyStandaloneArtifact') {
	dependsOn tasks.named('verifySourceIndependence')
	dependsOn tasks.named('verifyStandaloneJar')
}

// Keep every ordinary test run enforcing the standalone boundary as well.
tasks.named('test') {
	dependsOn tasks.named('verifyStandaloneArtifact')
}

tasks.register('collectRuntimeLicenses') {
	dependsOn configurations.runtimeClasspath
	inputs.files(configurations.runtimeClasspath)
	outputs.dir(layout.buildDirectory.dir('generated/runtime-licenses'))

	doLast {
		def outputDirectory = layout.buildDirectory.dir('generated/runtime-licenses').get().asFile
		delete outputDirectory
		outputDirectory.mkdirs()

		def artifacts = standaloneRuntimeArtifacts().sort {
			left, right ->
			"${left.moduleVersion.id.group}:${left.name}:${left.moduleVersion.id.version}:${left.classifier ?: ''}" <=>
				"${right.moduleVersion.id.group}:${right.name}:${right.moduleVersion.id.version}:${right.classifier ?: ''}"
		}
		def unexpectedModules = artifacts.collect {
			"${it.moduleVersion.id.group}:${it.name}".toString()
		}.toSet().findAll { !standaloneRuntimeModules.contains(it) }
		if (!unexpectedModules.isEmpty()) {
			throw new GradleException(
				"The runtime contains dependencies that have not been reviewed for redistribution: ${unexpectedModules.sort().join(', ')}"
			)
		}
		def inventory = []

		artifacts.each { artifact ->
			def classifierSuffix = artifact.classifier ? ":${artifact.classifier}" : ''
			def coordinate = "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}${classifierSuffix}"
			def artifactDirectoryName = coordinate.replaceAll('[^A-Za-z0-9._-]', '_')
			def artifactDirectory = new File(outputDirectory, artifactDirectoryName)
			def discoveredNotices = []

			zipTree(artifact.file).visit { details ->
				if (details.directory) {
					return
				}

				def path = details.relativePath.pathString
				def fileName = path.tokenize('/').last()
				if (fileName ==~ /(?i)(LICENSE|NOTICE|COPYING|COPYRIGHT)([._-].*)?/) {
					artifactDirectory.mkdirs()
					def destinationName = path.replaceAll('[^A-Za-z0-9._-]', '_')
					new File(artifactDirectory, destinationName).bytes = details.file.bytes
					discoveredNotices.add(path)
				}
			}

			def status = discoveredNotices.isEmpty()
				? 'no embedded notice; covered by the curated notices supplied with HapticScape'
				: "embedded: ${discoveredNotices.sort().join(', ')}"
			inventory.add("${coordinate} -- ${status}")
		}

		new File(outputDirectory, 'RESOLVED-DEPENDENCIES.txt').setText(
			inventory.join(System.lineSeparator()) + System.lineSeparator(),
			'UTF-8'
		)
	}
}

// Explicit Linux native check: exercises bindings without contacting the user's wallet.
tasks.register('verifyLinuxKeyringBindings', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.ashy0019.hapticscape.integration.desktop.LibsecretFailureSmoke'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	description = 'Checks Linux libsecret bindings against an isolated unreachable session bus.'
	onlyIf { System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('linux') }
	doFirst {
		def isolatedDirectory = java.nio.file.Files.createTempDirectory('hapticscape-keyring-smoke-')
		environment 'DBUS_SESSION_BUS_ADDRESS', "unix:path=${isolatedDirectory.resolve('no-bus')}"
		// The empty directory owns no socket or secret; remove it after execution.
		ext.isolatedKeyringDirectory = isolatedDirectory
	}
	doLast {
		java.nio.file.Files.deleteIfExists(ext.isolatedKeyringDirectory)
	}
}

// Tests the real GIO/D-Bus tray protocol without touching the desktop session bus.
tasks.register('verifyLinuxTray', Exec) {
	dependsOn tasks.named('testClasses')
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	description = 'Checks native StatusNotifierItem and DBusMenu on a disposable session bus.'
	onlyIf { System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('linux') }
	doFirst {
		environment 'G_DEBUG', 'fatal-criticals'
		commandLine 'dbus-run-session', '--', new File(System.getProperty('java.home'), 'bin/java').absolutePath,
			'-Djava.awt.headless=true', '-cp', sourceSets.test.runtimeClasspath.asPath,
			'com.ashy0019.hapticscape.integration.desktop.LinuxTrayNativeSmoke'
	}
}
