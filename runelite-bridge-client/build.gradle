plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

// Keep the packaged bridge client deterministic. Override only for an explicit
// compatibility test, e.g. -PruneLiteVersion=1.12.39.
def runtimeProperties = new Properties()
file('RUNTIME.properties').withInputStream { runtimeProperties.load(it) }
def runeLiteVersion = providers.gradleProperty('runeLiteVersion').orElse(runtimeProperties.getProperty('runeLiteVersion'))

def bridgeSourceProperties = new Properties()
file('BRIDGE-SOURCE.properties').withInputStream { bridgeSourceProperties.load(it) }
def bridgeSourceCommit = bridgeSourceProperties.getProperty('sourceCommit')
def bridgeMainClass = 'com.ashy0019.hapticscape.bridgeclient.HapticScapeBridgeClient'
version = rootProject.version

def approvedRuntimeModules = [
    'aopalliance:aopalliance',
    'ch.qos.logback:logback-classic',
    'ch.qos.logback:logback-core',
    'com.fifesoft:autocomplete',
    'com.fifesoft:rsyntaxtextarea',
    'com.github.weisj:jsvg',
    'com.google.code.findbugs:jsr305',
    'com.google.code.gson:gson',
    'com.google.guava:guava',
    'com.google.inject:guice',
    'com.google.protobuf:protobuf-javalite',
    'com.squareup.okhttp3:okhttp',
    'com.squareup.okio:okio',
    'javax.inject:javax.inject',
    'net.java.dev.jna:jna',
    'net.java.dev.jna:jna-platform',
    'net.runelite.arn:http-api',
    'net.runelite:client',
    'net.runelite:discord',
    'net.runelite:flatlaf',
    'net.runelite:flatlaf-extras',
    'net.runelite:injected-client',
    'net.runelite:jagexauth',
    'net.runelite:jshell',
    'net.runelite:rlawt',
    'net.runelite:rlicn',
    'net.runelite:runelite-api',
    'net.sf.jopt-simple:jopt-simple',
    'org.apache.commons:commons-lang3',
    'org.apache.commons:commons-text',
    'org.json:json',
    'org.lwjgl:lwjgl',
    'org.lwjgl:lwjgl-opencl',
    'org.lwjgl:lwjgl-opengl',
    'org.slf4j:slf4j-api'
] as Set

dependencies {
    implementation group: 'net.runelite', name: 'client', version: runeLiteVersion.get()
    runtimeOnly group: 'net.runelite', name: 'jshell', version: runeLiteVersion.get()

    testImplementation 'junit:junit:4.12'
}

group = 'com.ashy0019.hapticscape.bridgeclient'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.named('processResources') {
    from('BRIDGE-SOURCE.properties')
}

tasks.register('runBridgeClient', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = bridgeMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

def runtimeArtifacts = {
    configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
}

tasks.register('verifyBridgeRuntimeDependencies') {
    dependsOn configurations.runtimeClasspath

    doLast {
        def runtimeModules = runtimeArtifacts().collect { artifact ->
            "${artifact.moduleVersion.id.group}:${artifact.name}".toString()
        }.toSet()
        def unexpectedModules = runtimeModules.findAll { !approvedRuntimeModules.contains(it) }

        if (!unexpectedModules.isEmpty()) {
            throw new GradleException(
                "Bridge client runtime contains unreviewed dependencies: ${unexpectedModules.sort().join(', ')}"
            )
        }
    }
}

tasks.register('bridgeClientJar', Jar) {
    dependsOn tasks.named('classes')
    dependsOn configurations.runtimeClasspath

    manifest {
        attributes(
            'Main-Class': bridgeMainClass,
            'Multi-Release': true,
            'Implementation-Title': 'LumBridge',
            'Implementation-Version': rootProject.version,
            'HapticScape-Bridge-Source-Commit': bridgeSourceCommit,
            'HapticScape-RuneLite-Version': runeLiteVersion.get()
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output)
    from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }

    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'

    group = BasePlugin.BUILD_GROUP
    archiveClassifier.set('bridge-client')
    archiveFileName.set('lumbridge.jar')
}

tasks.register('verifyBridgeClientJar') {
    dependsOn tasks.named('bridgeClientJar')
    dependsOn tasks.named('verifyBridgeRuntimeDependencies')
    dependsOn tasks.named('testClasses')

    doLast {
        def clientJar = tasks.named('bridgeClientJar').get().archiveFile.get().asFile
        def forbiddenEntries = []
        def localTestClassEntries = [] as Set

        sourceSets.test.output.classesDirs.files.each { classesDir ->
            if (classesDir.exists()) {
                fileTree(classesDir).matching {
                    include '**/*.class'
                }.visit { classDetails ->
                    if (!classDetails.directory) {
                        localTestClassEntries.add(classDetails.relativePath.pathString)
                    }
                }
            }
        }
        def hasLauncher = false
        def hasBridgePlugin = false
        def hasProvenance = false

        zipTree(clientJar).visit { details ->
            if (details.directory) {
                return
            }

            def path = details.relativePath.pathString
            if (path == 'com/ashy0019/hapticscape/bridgeclient/HapticScapeBridgeClient.class') {
                hasLauncher = true
            }
            if (path == 'com/ashy0019/localeventbridge/LocalEventBridgePlugin.class') {
                hasBridgePlugin = true
            }
            if (path == 'BRIDGE-SOURCE.properties') {
                hasProvenance = true
            }
            if (path.startsWith('org/junit/')
                || path.startsWith('org/hamcrest/')
                || localTestClassEntries.contains(path)) {
                forbiddenEntries.add(path)
            }
            if (path.startsWith('com/ashy0019/hapticscape/')
                && !path.startsWith('com/ashy0019/hapticscape/bridgeclient/')) {
                forbiddenEntries.add(path)
            }
        }

        if (!hasLauncher) {
            throw new GradleException('The packaged RuneLite bridge launcher class is missing.')
        }
        if (!hasBridgePlugin) {
            throw new GradleException('The packaged Local Event Bridge plugin class is missing.')
        }
        if (!hasProvenance) {
            throw new GradleException('Bridge source provenance metadata is missing.')
        }
        if (!forbiddenEntries.isEmpty()) {
            throw new GradleException(
                "Forbidden code leaked into the bridge client JAR: ${forbiddenEntries.sort().join(', ')}"
            )
        }
    }
}

tasks.register('collectRuntimeLicenses') {
    dependsOn configurations.runtimeClasspath
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(layout.buildDirectory.dir('generated/runtime-licenses'))

    doLast {
        def outputDirectory = layout.buildDirectory.dir('generated/runtime-licenses').get().asFile
        delete outputDirectory
        outputDirectory.mkdirs()

        def artifacts = runtimeArtifacts().sort { left, right ->
            "${left.moduleVersion.id.group}:${left.name}:${left.moduleVersion.id.version}:${left.classifier ?: ''}" <=>
                "${right.moduleVersion.id.group}:${right.name}:${right.moduleVersion.id.version}:${right.classifier ?: ''}"
        }
        def unexpectedModules = artifacts.collect {
            "${it.moduleVersion.id.group}:${it.name}".toString()
        }.toSet().findAll { !approvedRuntimeModules.contains(it) }
        if (!unexpectedModules.isEmpty()) {
            throw new GradleException(
                "The bridge runtime contains dependencies that have not been reviewed for redistribution: ${unexpectedModules.sort().join(', ')}"
            )
        }

        def inventory = []
        artifacts.each { artifact ->
            def classifierSuffix = artifact.classifier ? ":${artifact.classifier}" : ''
            def coordinate = "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}${classifierSuffix}"
            def artifactDirectoryName = coordinate.replaceAll('[^A-Za-z0-9._-]', '_')
            def artifactDirectory = new File(outputDirectory, artifactDirectoryName)
            def discoveredNotices = []

            zipTree(artifact.file).visit { details ->
                if (details.directory) {
                    return
                }

                def path = details.relativePath.pathString
                def fileName = path.tokenize('/').last()
                if (fileName ==~ /(?i)(LICENSE|NOTICE|COPYING|COPYRIGHT)([._-].*)?/) {
                    artifactDirectory.mkdirs()
                    def destinationName = path.replaceAll('[^A-Za-z0-9._-]', '_')
                    new File(artifactDirectory, destinationName).bytes = details.file.bytes
                    discoveredNotices.add(path)
                }
            }

            def status = discoveredNotices.isEmpty()
                ? 'no embedded notice; see curated notices bundled with HapticScape'
                : "embedded: ${discoveredNotices.sort().join(', ')}"
            inventory.add("${coordinate} -- ${status}")
        }

        new File(outputDirectory, 'RESOLVED-DEPENDENCIES.txt').setText(
            inventory.join(System.lineSeparator()) + System.lineSeparator(),
            'UTF-8'
        )
    }
}

tasks.register('verifyBridgeClientArtifact') {
    dependsOn tasks.named('test')
    dependsOn tasks.named('verifyBridgeClientJar')
}
